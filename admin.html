<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Spectrum Admin</title>
<style>
:root{--ink:#20263a;--muted:#68718b;--navy:#121a33;--bg:#f4f6fb;--line:#dfe3ed;--accent:#6957e8;--teal:#35c9c5;--soft:#f6f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:linear-gradient(var(--navy) 0 230px,var(--bg) 230px);color:var(--ink);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:30px 16px 60px}.brand{color:white;margin-bottom:28px}.brand h1{margin:0}.brand p{color:#c9d0e5}.card{background:white;border-radius:20px;padding:26px;box-shadow:0 15px 45px #1112;margin-bottom:18px}.muted{color:var(--muted)}input{width:100%;padding:12px;border:1px solid #ccd3e1;border-radius:10px}.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.hidden{display:none!important}.error{background:#fff0ef;padding:12px;border-radius:10px;margin-top:12px;color:#8a1c1c}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table td,.table th{padding:10px;border-bottom:1px solid #e3e7f0;text-align:left;font-size:13px}.table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.barrow{display:grid;grid-template-columns:280px 1fr 62px;gap:10px;align-items:center;margin:10px 0}.bar{height:10px;background:#e9edf6;border-radius:10px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--teal),var(--accent))}.feedback,.soft{background:var(--soft);border-radius:12px;padding:14px;margin-top:14px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0edff;color:#5542ca;font-size:12px;font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.spectrum{border:1px solid var(--line);border-radius:14px;padding:15px}.spectrum h3{margin:0 0 5px}.facet{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #eceff5;font-size:13px}.career{border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:10px}.career h4{margin:0 0 5px}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.scoreline{display:flex;gap:20px;flex-wrap:wrap}.scorebox{background:var(--soft);border-radius:12px;padding:12px;min-width:160px}.scorebox b{display:block;font-size:24px}details{margin-top:14px}pre{background:#10172d;color:#dbe2f5;padding:14px;border-radius:12px;overflow:auto;max-height:480px;font-size:12px}.why{font-size:13px;color:#505970;padding-left:18px}.topActions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:760px){.grid2{grid-template-columns:1fr}.barrow{grid-template-columns:1fr 55px}.barrow .bar{grid-column:1/-1}.card{padding:20px}}
</style></head>
<body><div class="wrap">
<div class="brand"><h1>Aurora Spectrum Admin</h1><p>Research assessment dashboard • v0.2/v0.3 historical + v0.3.1 research</p></div>
<div class="card" id="login"><h2>Administrator sign in</h2><input type="password" id="pw" placeholder="Password"><p><button class="btn" id="loginBtn">Sign in</button></p><div id="msg"></div></div>
<div id="dash" class="hidden">
  <div class="card"><div class="topActions"><div><h2 style="margin:0">Candidate submissions</h2><p class="muted" style="margin:5px 0 0">Historical v0.2/v0.3 profiles and new v0.3.1 research profiles remain together.</p></div><button class="btn" id="refreshBtn">Refresh</button></div></div>
  <div class="card tableWrap"><table class="table"><thead><tr><th>Candidate</th><th>Position</th><th>Version</th><th>Date</th><th>Judgement</th><th>Reasoning</th><th>Accuracy</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  <div id="detail"></div>
</div></div>
<script>
const API='https://gazmnfynliigaxgydeqh.supabase.co/functions/v1/aurora-spectrum-api';let password='';const $=id=>document.getElementById(id);const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function scoreOf(v){return typeof v==='object'&&v!==null?v.score:v}
async function load(){password=$('pw').value||password;const r=await fetch(API+'/admin',{headers:{'x-aurora-password':password}});if(!r.ok){$('msg').innerHTML='<div class="error">Incorrect password.</div>';return}const d=await r.json();$('login').classList.add('hidden');$('dash').classList.remove('hidden');$('rows').innerHTML=d.map(x=>{const s=x.payload?.scores||{},f=x.payload?.pilotFeedback,j=scoreOf(s.judgement),re=scoreOf(s.reasoning),acc=f?.accuracy?f.accuracy+'/5':'—';return `<tr><td><b>${e(x.candidate_name)}</b><br><span class="muted">${e(x.candidate_email||'')}</span></td><td>${e(x.position)}</td><td>${e(x.payload?.version||'')}</td><td>${new Date(x.completed_at).toLocaleString()}</td><td>${j??'—'}${j!==undefined&&j!==null?'%':''}</td><td>${re??'—'}${re!==undefined&&re!==null?'%':''}</td><td>${acc}</td><td><button class="btn" style="padding:7px 10px" data-view="${x.id}">View</button></td></tr>`}).join('');document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>view(b.dataset.view)))}
function legacyDetail(x,s,f){const feedback=feedbackHtml(f);return `<div class="card"><div class="eyebrow">Historical v0.2 profile</div><h2>${e(x.candidate_name)}</h2><p>${e(x.position)} • ${e(x.payload.version||'')}</p><h3>Personality dimensions</h3>${Object.entries(s.workstyle||{}).map(([k,v])=>`<div class="barrow"><div>${e(k)}</div><div class="bar"><div style="width:${v}%"></div></div><b>${v}%</b></div>`).join('')}<h3>Composite measures</h3><p><b>Judgement:</b> ${e(s.judgement)}% &nbsp;&nbsp; <b>Reasoning:</b> ${e(s.reasoning)}%</p>${feedback}${rawHtml(x.payload.answers)}</div>`}
function feedbackHtml(f){return f?`<div class="feedback"><h3>Pilot / research feedback</h3><p><b>Profile accuracy:</b> ${e(f.accuracy)}/5</p><p><b>Least accurate result:</b> ${e(f.leastAccurate||'None / not sure')}</p><p><b>Question issue:</b> ${e(f.questionIssue||'Not answered')}</p><p><b>Comments:</b> ${e(f.comments||'No comments')}</p></div>`:'<div class="feedback"><b>No feedback submitted yet.</b></div>'}
function rawHtml(a){return `<details><summary><b>Raw stored responses</b></summary><pre>${e(JSON.stringify(a||{},null,2))}</pre></details>`}
function v03Detail(x,s,f){const spectra=Object.values(s.personality?.spectra||{});const wp=s.career||{};return `<div class="card"><div class="eyebrow">Research profile</div><h2>${e(x.candidate_name)}</h2><p>${e(x.position)} • ${e(x.payload.version||'')} • Results model ${e(x.payload.resultsModelVersion||s.resultsModelVersion||'')}</p><div class="scoreline"><div class="scorebox">Applied Judgement<b>${e(s.judgement?.score)}%</b>${e(s.judgement?.band||'')}</div><div class="scorebox">Workplace Reasoning<b>${e(s.reasoning?.score)}%</b>${e(s.reasoning?.band||'')}</div><div class="scorebox">Primary Work Drive<b style="font-size:16px">${e(wp.primary||'—')}</b></div></div><h3>Six Core Spectrums</h3><div class="grid2">${spectra.map(sp=>`<div class="spectrum"><div class="eyebrow">${e(sp.short)}</div><h3>${e(sp.name)}</h3><span class="pill">${e(sp.band?.label||'')}</span><b style="float:right">${e(sp.score)}%</b><div class="bar"><div style="width:${sp.score}%"></div></div>${(sp.facets||[]).map(fc=>`<div class="facet"><span>${e(fc.name)}</span><b>${e(fc.score)}%</b></div>`).join('')}<ul class="why">${(sp.why||[]).map(w=>`<li>${e(w)}</li>`).join('')}</ul></div>`).join('')}</div><h3>Work Preference Lens</h3><div class="soft"><p><b>Primary:</b> ${e(wp.primary||'—')} &nbsp; • &nbsp; <b>Secondary:</b> ${e(wp.secondary||'—')}</p><p><b>Environment:</b> ${e(wp.environment||'—')} &nbsp; • &nbsp; <b>Motivator:</b> ${e(wp.motivator||'—')}</p></div><h3>Career Compass</h3>${(wp.careerFamilies||[]).map(c=>`<div class="career"><h4>${e(c.name)} <span class="pill">${e(c.label)}</span></h4><div class="muted">${e((c.examples||[]).join(' • '))}</div><ul class="why">${(c.reasons||[]).map(r=>`<li>${e(r)}</li>`).join('')}</ul></div>`).join('')||'<div class="soft">No career families generated.</div>'}${feedbackHtml(f)}${rawHtml(x.payload.answers)}</div>`}
async function view(id){const r=await fetch(API+'/admin/'+id,{headers:{'x-aurora-password':password}});if(!r.ok)return;const x=await r.json(),s=x.payload?.scores||{},f=x.payload?.pilotFeedback||null;$('detail').innerHTML=s.personality?.spectra?v03Detail(x,s,f):legacyDetail(x,s,f);$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
$('loginBtn').addEventListener('click',load);$('refreshBtn').addEventListener('click',load);$('pw').addEventListener('keydown',ev=>{if(ev.key==='Enter')load()});
</script></body></html>
